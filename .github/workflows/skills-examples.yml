name: Skills Examples Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skills-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up MoonBit
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: post install
        run: |
          moon version --all
          moon update
      - name: Validate skills examples
        run: python scripts/check_skills_examples.py
